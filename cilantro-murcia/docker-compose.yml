# Stack completo: API FastAPI + PostgreSQL/PostGIS.
# Arranque:  docker compose up --build
# UI:        http://localhost:8000/
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cilantro
      POSTGRES_PASSWORD: cilantro
      POSTGRES_DB: cilantro
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cilantro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://cilantro:cilantro@db:5432/cilantro
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # SIAR_API_KEY: ${SIAR_API_KEY}
      # AEMET_API_KEY: ${AEMET_API_KEY}
    ports: ["8000:8000"]

volumes:
  pgdata:
